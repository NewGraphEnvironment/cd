url: https://newgraphenvironment.github.io/cd/
template:
  bootstrap: 5

reference:
- title: Read the data
  desc: Climate series for an area, or daily air temperature at points.
  contents:
  - cd_catalog
  - cd_catalog_default
  - cd_extract
  - cd_extract_daily
  - cd_crop
- title: Departures and trends
  desc: Compare a series with a baseline or between two windows, test its trend, and tabulate the result. These take any annual series in cd's long format.
  contents:
  - cd_baseline
  - cd_anomaly
  - cd_compare
  - cd_trend
  - cd_summary
- title: Plots
  contents:
  - cd_plot_timeseries
  - cd_plot_comparison
- title: Variables, periods and seasons
  contents:
  - cd_variables
  - cd_periods
  - cd_seasons
- title: Cache
  desc: Files are cached after the first read and downloaded again only when they are republished.
  contents:
  - starts_with("cd_cache_")
- title: Publishing the catalog
  desc: For maintainers. A scheduled workflow uses these to write the published files and catalog; users do not need them.
  contents:
  - cd_aggregate
  - cd_cog_write
  - cd_stac_catalog
  - cd_s3_push
- title: Downloading from the Copernicus Climate Data Store
  desc: An alternative route to monthly ERA5-Land through the Copernicus Climate Data Store. The published catalog is not built this way.
  contents:
  - cd_fetch
  - cd_derive
